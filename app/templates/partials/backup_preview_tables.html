    <!-- Ukryty kontener z pełnymi statystykami par dysków dla natychmiastowego filtrowania w JS -->
    <script id="backup-pair-counts-data" type="application/json">{{ pair_counts|safe if pair_counts is defined else '{}' }}</script>

    <div class="bg-slate-900/60 border border-borderBg rounded-xl p-3 flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="text-slate-300">
            Wybrane operacje do wykonania —
            Nowe kopie: <strong id="unbacked-filtered-count" class="text-emerald-400 font-mono">{{ unbacked_total }}</strong> szt. |
            Kopie lokalne: <strong id="local-reloc-filtered-count" class="text-sky-400 font-mono">{{ local_reloc_total|default(0) }}</strong> szt. |
            Kopie zdalne: <strong id="remote-move-filtered-count" class="text-teal-300 font-mono">{{ remote_move_total|default(0) }}</strong> szt. |
            Do albumu „Ważne”: <strong id="important-filtered-count" class="text-amber-400 font-mono">{{ important_total|default(0) }}</strong> szt.
        </div>
        <button type="button"
                onclick="document.getElementById('backup-modal').classList.add('hidden'); applySidebarFilter({_reset: true, unbacked_only: true});"
                class="text-emerald-400 hover:underline text-[11px] font-semibold">
            Pokaż pliki bez backupu w głównej galerii &rarr;
        </button>
    </div>
